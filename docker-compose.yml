version: '3.8'

services:
  # ---------------------------------------------------------
  # Graph Database: Neo4j 5 Community with GDS Plugin
  # ---------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: sih_neo4j
    ports:
      - "7474:7474" # HTTP Web Interface
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/sih2026password
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # ---------------------------------------------------------
  # Relational DB & Audit Logger: PostgreSQL 16
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sih_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sih_investigation
      - POSTGRES_USER=sih_admin
      - POSTGRES_PASSWORD=sih_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------
  # Backend API: FastAPI + NLP + Analytics Engine
  # ---------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sih2026password
      - POSTGRES_URI=postgresql://sih_admin:sih_secure_password@postgres:5432/sih_investigation
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    depends_on:
      - neo4j
      - postgres

  # ---------------------------------------------------------
  # Frontend UI: React 18 + Vite SPA Command Center
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
